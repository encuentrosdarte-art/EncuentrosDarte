<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | EncuentrosDArte</title>
  <meta name="description" content="Redirecting to the contact section of EncuentrosDArte." />
  <link rel="canonical" href="https://encuentrosdarte.com/#contact" />
  <meta http-equiv="refresh" content="0; url=https://encuentrosdarte.com/#contact" />
  <style>
    :root {
      --charcoal: #0f1115;
      --smoke: #f4f4f1;
      --gold: #d4a853;
      --ink: #1a1f2b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: "Inter", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, #20242f 0%, var(--charcoal) 55%);
      color: var(--smoke);
    }

    .card {
      max-width: 680px;
      width: 100%;
      padding: 2rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 168, 83, 0.35);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 .8rem;
      font-size: clamp(1.65rem, 4vw, 2.4rem);
      line-height: 1.1;
      color: var(--gold);
    }

    p {
      margin: .3rem 0;
      line-height: 1.7;
      color: rgba(244, 244, 241, 0.9);
    }

    .actions {
      margin-top: 1.2rem;
      display: flex;
      gap: .8rem;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      text-decoration: none;
      padding: .75rem 1rem;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .primary {
      background: var(--gold);
      color: var(--ink);
    }

    .ghost {
      border-color: rgba(244, 244, 241, 0.5);
      color: var(--smoke);
    }
  </style>
  <script>
    window.location.replace('/#contact');
  </script>
</head>
<body>
  <main class="card">
    <h1>Contact us</h1>
    <p>You are being redirected to the contact section of EncuentrosDArte.</p>
    <p>If the redirect does not start automatically, use one of the buttons below.</p>
    <div class="actions">
      <a class="primary" href="/#contact">Go to contact section</a>
      <a class="ghost" href="/">Back to homepage</a>
    </div>
  </main>
</body>
</html>
